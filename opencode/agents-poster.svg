    <text class="td"    x="80" y="23">Small 3</text>
    <text class="tdVar" x="80" y="26.5">codestral</text>

    <line x1="3" y1="29" x2="93" y2="29" stroke="#eee" stroke-width="0.25"/>

    <rect class="main" x="4" y="32" width="14" height="5" rx="1"/>
    <text class="chip" x="6" y="36">SONNET</text>
    <text class="td"   x="22" y="36">Sonnet 4.6</text>
    <text class="tdVar" x="22" y="39.5">variant · med/high</text>
    <text class="td"   x="40" y="36">gpt-5</text>
    <text class="tdVar" x="40" y="39.5">variant · med/high</text>
    <text class="tdM"  x="55" y="36">deepseek-pro</text>
    <text class="tdVar" x="55" y="39.5">kimi-k2.6 · glm-5</text>
    <text class="td"   x="80" y="36">Medium</text>
    <text class="tdVar" x="80" y="39.5">codestral-2</text>

    <line x1="3" y1="42" x2="93" y2="42" stroke="#eee" stroke-width="0.25"/>

    <rect class="heavy" x="4" y="45" width="14" height="5" rx="1"/>
    <text class="chip"  x="7" y="49">OPUS</text>
    <text class="td"    x="22" y="49">Opus 4.7</text>
    <text class="tdVar" x="22" y="52.5">variant · high/xhigh</text>
    <text class="td"    x="40" y="49">o3</text>
    <text class="tdVar" x="40" y="52.5">variant · high/xhigh</text>
    <text class="tdM"   x="55" y="49">glm-5.1</text>
    <text class="tdVar" x="55" y="52.5">qwen3.6 · minimax</text>
    <text class="td"    x="80" y="49">Large 2</text>
    <text class="tdVar" x="80" y="52.5">reasoning</text>

    <line x1="3" y1="55" x2="93" y2="55" stroke="#c9c4b5" stroke-width="0.3"/>

    <text class="legendH" x="4" y="61">Flow</text>
    <text class="flow" x="4" y="66">Sisyphus → Metis →</text>
    <text class="flow" x="4" y="70">Prometheus → Momus →</text>
    <text class="flow" x="4" y="74">Hephaestus / Atlas → Oracle.</text>
  </g>

  <!-- ROW 4 : delegation categories -->

  <text class="catSectionH" x="12" y="258">Delegation categories · Sisyphus routes each subtask to one of these buckets</text>

  <g transform="translate(12,262)">
    <rect class="card" width="62" height="30" rx="3"/>
    <rect class="main" width="3" height="30" rx="1.5"/>
    <text class="catN"  x="7" y="10">visual-engineering</text>
    <text class="catAlt" x="7" y="14">a.k.a. Frontend Artisan</text>
    <text class="catD"  x="7" y="19">UI, CSS, animation, layout.</text>
    <rect class="main" x="7"  y="22" width="24" height="5" rx="1"/>
