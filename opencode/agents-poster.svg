    <text class="chipL" x="35" y="25.7">gpt-5-mini · low</text>
  </g>

  <g transform="translate(276,262)">
    <rect class="card" width="62" height="30" rx="3"/>
    <rect class="main" width="3" height="30" rx="1.5"/>
    <text class="catN"  x="7" y="10">writing</text>
    <text class="catAlt" x="7" y="14">a.k.a. Scribe</text>
    <text class="catD"  x="7" y="19">Docs, prose, technical text.</text>
    <rect class="main" x="7"  y="22" width="24" height="5" rx="1"/>
    <text class="chip" x="9" y="25.7">SONNET · med</text>
    <rect class="main" x="33" y="22" width="24" height="5" rx="1"/>
    <text class="chipL" x="35" y="25.7">gpt-5 · med</text>
  </g>

  <g transform="translate(342,262)">
    <rect class="card" width="62" height="30" rx="3"/>
    <rect class="heavy" width="3" height="30" rx="1.5"/>
    <text class="catN"  x="7" y="10">artistry</text>
    <text class="catAlt" x="7" y="14">a.k.a. Maker</text>
    <text class="catD"  x="7" y="19">Creative, unconventional work.</text>
    <rect class="heavy" x="7"  y="22" width="24" height="5" rx="1"/>
    <text class="chip" x="10" y="25.7">OPUS · high</text>
    <rect class="heavy" x="33" y="22" width="24" height="5" rx="1"/>
