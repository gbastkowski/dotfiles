    <text class="th" x="22" y="14">ANTHROPIC</text>
    <text class="th" x="40" y="14">OPENAI</text>
    <text class="th" x="55" y="14">OPEN-SRC</text>
    <text class="th" x="80" y="14">MISTRAL</text>

    <line x1="3" y1="16" x2="93" y2="16" stroke="#c9c4b5" stroke-width="0.3"/>

    <rect class="cheap" x="4" y="19" width="14" height="5" rx="1"/>
    <text class="chip"  x="6" y="23">HAIKU</text>
    <text class="td"    x="22" y="23">Haiku 4.5</text>
    <text class="tdVar" x="22" y="26.5">variant · med</text>
    <text class="td"    x="40" y="23">gpt-5-mini</text>
