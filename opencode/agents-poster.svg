    <rect class="main" width="3" height="30" rx="1.5"/>
    <text class="catN"  x="7" y="10">deep</text>
    <text class="catAlt" x="7" y="14">a.k.a. Deep Agent</text>
    <text class="catD"  x="7" y="19">Autonomous research + impl.</text>
    <rect class="main" x="7"  y="22" width="24" height="5" rx="1"/>
    <text class="chip" x="9" y="25.7">SONNET · med</text>
    <rect class="main" x="33" y="22" width="24" height="5" rx="1"/>
    <text class="chipL" x="35" y="25.7">gpt-5 · med</text>
  </g>

  <g transform="translate(210,262)">
    <rect class="card" width="62" height="30" rx="3"/>
    <rect class="cheap" width="3" height="30" rx="1.5"/>
    <text class="catN"  x="7" y="10">quick</text>
    <text class="catAlt" x="7" y="14">a.k.a. Sprinter</text>
    <text class="catD"  x="7" y="19">Trivial fixes, one-line edits.</text>
    <rect class="cheap" x="7"  y="22" width="24" height="5" rx="1"/>
    <text class="chip" x="10" y="25.7">HAIKU · low</text>
