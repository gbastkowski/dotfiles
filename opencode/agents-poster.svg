<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="420mm" height="297mm"
     viewBox="0 0 420 297"
     font-family="Helvetica, Arial, sans-serif">

  <style><![CDATA[
    .bg     { fill: #fafaf7; }
    .card   { fill: #ffffff; stroke: #d9d5c8; stroke-width: 0.3; }
    .name   { font-size: 5.6px; font-weight: 700; fill: #111; }
    .myth   { font-size: 3.1px; font-style: italic; fill: #6b6b6b; }
    .role   { font-size: 3.6px; fill: #1e1e1e; }
    .chip   { font-size: 2.4px; font-weight: 600; fill: #fff; }
    .chipL  { font-size: 2.2px; font-weight: 700; fill: #fff; letter-spacing: 0.1px; }
    .glyph  { font-size: 12px; }
    .cheap  { fill: #7CB342; }
    .main   { fill: #4A90E2; }
    .heavy  { fill: #E67E22; }
    .legendH{ font-size: 3.8px; font-weight: 700; fill: #111; }
    .th     { font-size: 2.4px; font-weight: 700; fill: #666; letter-spacing: 0.3px; }
    .td     { font-size: 2.8px; fill: #1e1e1e; }
    .tdM    { font-size: 2.8px; font-weight: 600; fill: #111; }
    .tdVar  { font-size: 2.3px; fill: #777; }
    .flow   { font-size: 2.8px; fill: #222; }
    .catN   { font-size: 4.4px; font-weight: 700; fill: #111; }
    .catAlt { font-size: 2.6px; font-style: italic; fill: #6b6b6b; }
    .catD   { font-size: 2.7px; fill: #333; }
    .catSectionH { font-size: 4.2px; font-weight: 700; fill: #111; letter-spacing: 0.3px; }
  ]]></style>

  <rect class="bg" width="420" height="297"/>

  <!-- ROW 1 -->

  <g transform="translate(12,8)">
    <rect class="card" width="96" height="78" rx="3"/>
    <rect class="main" width="3" height="78" rx="1.5"/>
    <text class="glyph" x="8" y="15">🪨</text>
    <text class="name"  x="24" y="13">Sisyphus</text>
    <text class="myth"  x="24" y="18">King of Corinth who cheated death twice.</text>
    <text class="myth"  x="24" y="22.5">Cursed to roll a boulder that always slips back.</text>
    <text class="role"  x="8"  y="33">Main orchestrator.</text>
    <text class="role"  x="8"  y="39">Classifies intent, routes work,</text>
    <text class="role"  x="8"  y="45">delegates to specialists, verifies</text>
    <text class="role"  x="8"  y="51">every step. Never breaks the loop.</text>
    <rect class="main" x="8"  y="65" width="35" height="6" rx="1.5"/>
    <text class="chip"  x="10" y="69.3">SONNET · med</text>
    <rect class="main" x="46" y="65" width="42" height="6" rx="1.5"/>
    <text class="chipL" x="48" y="69.3">gpt-5 · med</text>
  </g>

  <g transform="translate(112,8)">
    <rect class="card" width="96" height="78" rx="3"/>
    <rect class="cheap" width="3" height="78" rx="1.5"/>
    <text class="glyph" x="8" y="15">🪨</text>
    <text class="name"  x="24" y="13">Sisyphus-junior</text>
    <text class="myth"  x="24" y="18">The apprentice at the foot of the hill.</text>
    <text class="myth"  x="24" y="22.5">Same task, less weight, more turns per day.</text>
    <text class="role"  x="8"  y="33">Cheap orchestrator clone.</text>
    <text class="role"  x="8"  y="39">Runs low-stakes routing and</text>
    <text class="role"  x="8"  y="45">simple sub-tasks. Same protocol,</text>
    <text class="role"  x="8"  y="51">smaller brain, faster budget.</text>
    <rect class="cheap" x="8"  y="65" width="35" height="6" rx="1.5"/>
    <text class="chip"  x="11" y="69.3">HAIKU · med</text>
    <rect class="cheap" x="46" y="65" width="42" height="6" rx="1.5"/>
    <text class="chipL" x="48" y="69.3">gpt-5-mini · med</text>
  </g>

  <g transform="translate(212,8)">
    <rect class="card" width="96" height="78" rx="3"/>
    <rect class="main" width="3" height="78" rx="1.5"/>
    <text class="glyph" x="8" y="15">🦉</text>
    <text class="name"  x="24" y="13">Metis</text>
    <text class="myth"  x="24" y="18">First wife of Zeus, titan of cunning wisdom.</text>
    <text class="myth"  x="24" y="22.5">Zeus swallowed her to keep her counsel inside.</text>
    <text class="role"  x="8"  y="33">Pre-planner and scope clarifier.</text>
    <text class="role"  x="8"  y="39">Surfaces hidden intent, ambiguity</text>
    <text class="role"  x="8"  y="45">and edge cases before any plan</text>
    <text class="role"  x="8"  y="51">or code is written.</text>
    <rect class="main" x="8"  y="65" width="35" height="6" rx="1.5"/>
    <text class="chip"  x="10" y="69.3">SONNET · high</text>
    <rect class="main" x="46" y="65" width="42" height="6" rx="1.5"/>
    <text class="chipL" x="48" y="69.3">gpt-5 · high</text>
  </g>

  <g transform="translate(312,8)">
    <rect class="card" width="96" height="78" rx="3"/>
    <rect class="heavy" width="3" height="78" rx="1.5"/>
    <text class="glyph" x="8" y="15">🔥</text>
    <text class="name"  x="24" y="13">Prometheus</text>
    <text class="myth"  x="24" y="18">Titan whose name means "forethought".</text>
    <text class="myth"  x="24" y="22.5">Stole fire from Olympus and gave it to humans.</text>
    <text class="role"  x="8"  y="33">Planner. Breaks work into</text>
    <text class="role"  x="8"  y="39">atomic steps, flags parallelism,</text>
    <text class="role"  x="8"  y="45">weighs architectural tradeoffs</text>
    <text class="role"  x="8"  y="51">before execution begins.</text>
    <rect class="heavy" x="8"  y="65" width="35" height="6" rx="1.5"/>
    <text class="chip"  x="11" y="69.3">OPUS · high</text>
    <rect class="heavy" x="46" y="65" width="42" height="6" rx="1.5"/>
    <text class="chipL" x="48" y="69.3">o3 · high</text>
  </g>

  <!-- ROW 2 -->

  <g transform="translate(12,90)">
    <rect class="card" width="96" height="78" rx="3"/>
    <rect class="heavy" width="3" height="78" rx="1.5"/>
    <text class="glyph" x="8" y="15">😾</text>
    <text class="name"  x="24" y="13">Momus</text>
    <text class="myth"  x="24" y="18">God of mockery, blame and harsh criticism.</text>
    <text class="myth"  x="24" y="22.5">Exiled from Olympus for finding fault in every god.</text>
    <text class="role"  x="8"  y="33">Plan reviewer.</text>
    <text class="role"  x="8"  y="39">Rates clarity, verifiability and</text>
    <text class="role"  x="8"  y="45">completeness. Catches gaps and</text>
    <text class="role"  x="8"  y="51">missing context. Strictest critic.</text>
    <rect class="heavy" x="8"  y="65" width="35" height="6" rx="1.5"/>
    <text class="chip"  x="10" y="69.3">OPUS · xhigh</text>
    <rect class="heavy" x="46" y="65" width="42" height="6" rx="1.5"/>
    <text class="chipL" x="48" y="69.3">o3 · xhigh</text>
  </g>

  <g transform="translate(112,90)">
    <rect class="card" width="96" height="78" rx="3"/>
    <rect class="main" width="3" height="78" rx="1.5"/>
    <text class="glyph" x="8" y="15">🔨</text>
    <text class="name"  x="24" y="13">Hephaestus</text>
    <text class="myth"  x="24" y="18">Lame smith of the gods, forger of Olympus.</text>
    <text class="myth"  x="24" y="22.5">Made armor, thunderbolts and living automatons.</text>
    <text class="role"  x="8"  y="33">Builder.</text>
    <text class="role"  x="8"  y="39">Writes code, applies edits,</text>
    <text class="role"  x="8"  y="45">executes plans. Matches existing</text>
    <text class="role"  x="8"  y="51">patterns, keeps diff minimal.</text>
    <rect class="main" x="8"  y="65" width="35" height="6" rx="1.5"/>
    <text class="chip"  x="10" y="69.3">SONNET · med</text>
    <rect class="main" x="46" y="65" width="42" height="6" rx="1.5"/>
    <text class="chipL" x="48" y="69.3">gpt-5 · med</text>
  </g>

  <g transform="translate(212,90)">
    <rect class="card" width="96" height="78" rx="3"/>
    <rect class="main" width="3" height="78" rx="1.5"/>
    <text class="glyph" x="8" y="15">🌍</text>
    <text class="name"  x="24" y="13">Atlas</text>
    <text class="myth"  x="24" y="18">Titan condemned after the war of the gods.</text>
    <text class="myth"  x="24" y="22.5">Holds up the sky at the edge of the world.</text>
    <text class="role"  x="8"  y="33">Autonomous deep worker.</text>
    <text class="role"  x="8"  y="39">Carries hairy multi-step problems</text>
    <text class="role"  x="8"  y="45">end-to-end with thorough research</text>
    <text class="role"  x="8"  y="51">first. Own todo list, own verify.</text>
    <rect class="main" x="8"  y="65" width="35" height="6" rx="1.5"/>
    <text class="chip"  x="10" y="69.3">SONNET · med</text>
    <rect class="main" x="46" y="65" width="42" height="6" rx="1.5"/>
    <text class="chipL" x="48" y="69.3">gpt-5 · med</text>
  </g>

  <g transform="translate(312,90)">
    <rect class="card" width="96" height="78" rx="3"/>
    <rect class="heavy" width="3" height="78" rx="1.5"/>
    <text class="glyph" x="8" y="15">🔮</text>
    <text class="name"  x="24" y="13">Oracle</text>
    <text class="myth"  x="24" y="18">The Pythia at Delphi, priestess of Apollo.</text>
    <text class="myth"  x="24" y="22.5">Kings and generals came for her cryptic verdicts.</text>
    <text class="role"  x="8"  y="33">Read-only high-IQ consult.</text>
    <text class="role"  x="8"  y="39">Architecture calls, hard debug,</text>
    <text class="role"  x="8"  y="45">security review, self-review after</text>
    <text class="role"  x="8"  y="51">big changes. Expensive — sparingly.</text>
    <rect class="heavy" x="8"  y="65" width="35" height="6" rx="1.5"/>
    <text class="chip"  x="11" y="69.3">OPUS · high</text>
    <rect class="heavy" x="46" y="65" width="42" height="6" rx="1.5"/>
    <text class="chipL" x="48" y="69.3">o3 · high</text>
  </g>

  <!-- ROW 3 -->

  <g transform="translate(12,172)">
    <rect class="card" width="96" height="78" rx="3"/>
    <rect class="cheap" width="3" height="78" rx="1.5"/>
    <text class="glyph" x="8" y="15">🔍</text>
    <text class="name"  x="24" y="13">Explore</text>
    <text class="myth"  x="24" y="18">Not from myth — literal scout of terrain.</text>
    <text class="myth"  x="24" y="22.5">Think of Hermes' feet, running everywhere at once.</text>
    <text class="role"  x="8"  y="33">Contextual grep — local codebase.</text>
    <text class="role"  x="8"  y="39">Locates code, maps patterns,</text>
    <text class="role"  x="8"  y="45">finds references. Read-only,</text>
    <text class="role"  x="8"  y="51">fired in parallel, cheap and fast.</text>
    <rect class="cheap" x="8"  y="65" width="35" height="6" rx="1.5"/>
    <text class="chip"  x="11" y="69.3">HAIKU · med</text>
    <rect class="cheap" x="46" y="65" width="42" height="6" rx="1.5"/>
    <text class="chipL" x="48" y="69.3">gpt-5-mini · med</text>
  </g>

  <g transform="translate(112,172)">
    <rect class="card" width="96" height="78" rx="3"/>
    <rect class="cheap" width="3" height="78" rx="1.5"/>
    <text class="glyph" x="8" y="15">📚</text>
    <text class="name"  x="24" y="13">Librarian</text>
    <text class="myth"  x="24" y="18">Keeper of scrolls, echo of Alexandria.</text>
    <text class="myth"  x="24" y="22.5">Reads what others have already written down.</text>
    <text class="role"  x="8"  y="33">Reference grep — external.</text>
    <text class="role"  x="8"  y="39">Official docs, GitHub examples,</text>
    <text class="role"  x="8"  y="45">unfamiliar libraries, best-practice</text>
    <text class="role"  x="8"  y="51">lookups. Runs alongside Explore.</text>
    <rect class="cheap" x="8"  y="65" width="35" height="6" rx="1.5"/>
    <text class="chip"  x="11" y="69.3">HAIKU · med</text>
    <rect class="cheap" x="46" y="65" width="42" height="6" rx="1.5"/>
    <text class="chipL" x="48" y="69.3">gpt-5-mini · med</text>
  </g>

  <g transform="translate(212,172)">
    <rect class="card" width="96" height="78" rx="3"/>
    <rect class="main" width="3" height="78" rx="1.5"/>
    <text class="glyph" x="8" y="15">👁</text>
    <text class="name"  x="24" y="13">Multimodal-looker</text>
    <text class="myth"  x="24" y="18">The seer — Tiresias with eyes wide open.</text>
    <text class="myth"  x="24" y="22.5">Reads images the way others read text.</text>
    <text class="role"  x="8"  y="33">Vision agent.</text>
    <text class="role"  x="8"  y="39">Reads images, screenshots,</text>
    <text class="role"  x="8"  y="45">diagrams, UI mocks, sketches,</text>
    <text class="role"  x="8"  y="51">whiteboards. Feeds text back.</text>
    <rect class="main" x="8"  y="65" width="35" height="6" rx="1.5"/>
    <text class="chip"  x="10" y="69.3">SONNET · high</text>
    <rect class="main" x="46" y="65" width="42" height="6" rx="1.5"/>
    <text class="chipL" x="48" y="69.3">gpt-5 · high</text>
  </g>

  <!-- Legend / model tier table -->
