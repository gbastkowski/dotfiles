onboarding = false

# Ported from byobu/keybindings.tmux. Prefix is C-a, matching the byobu/tmux
# setup; ctrl+b stays free. Where byobu had a prefix binding and a prefix-free
# Alt binding for the same action, both are listed as an array.

[keys]
prefix = "ctrl+a"

# Pane focus: prefix+hjkl (byobu "bind -r h select-pane -L")
# plus prefix-free alt+hjkl (byobu "bind -n M-h select-pane -L").
focus_pane_left  = ["prefix+h", "alt+h", "super+shift+h"]
focus_pane_down  = ["prefix+j", "alt+j", "super+shift+j"]
focus_pane_up    = ["prefix+k", "alt+k", "super+shift+k"]
focus_pane_right = ["prefix+l", "alt+l", "super+shift+l"]

# Resize: byobu bound prefix+HJKL to resize-pane. herdr also has a modal
# resize mode (prefix+r) which is closer to "-r" repeat behaviour.
resize_pane_left  = "prefix+shift+h"
resize_pane_down  = "prefix+shift+j"
resize_pane_up    = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
resize_mode       = "prefix+r"

# Splits: byobu "bind s split-window -v" / "bind v split-window -h".
# herdr names splits by the resulting divider, so s -> horizontal, v -> vertical.
split_horizontal = ["prefix+s", "super+e"]
split_vertical   = ["prefix+v", "super+d"]

# Tabs stand in for byobu windows: "bind -r <" / "bind -r >" / "bind ` last-window".
# The super+... chords (Cmd on macOS) are passed through unchanged by
# kitty/herdr.conf via send_key, which needs herdr to have the kitty keyboard
# protocol enabled.
previous_tab = ["prefix+comma", "prefix+p", "super+["]
next_tab     = ["prefix+period", "prefix+n", "super+]"]
last_pane    = "prefix+backtick"

# Workspaces are the level above tabs: Cmd+{ / Cmd+} (= Cmd+Shift+[ / ]) next
# to Cmd+[ / Cmd+] for tabs. Both spellings, since it depends on how the
# terminal reports the shifted bracket.
previous_workspace = ["super+{", "super+shift+["]
next_workspace     = ["super+}", "super+shift+]"]

new_tab      = ["prefix+c", "super+t"]
close_tab    = "prefix+shift+x"
rename_tab   = ["prefix+shift+t", "super+,"]
switch_tab   = ["prefix+1..9", "super+1..9"]

# Pane lifecycle.
close_pane = "prefix+x"
zoom       = "prefix+z"
copy_mode  = ["prefix+[", "super+;"]

# byobu had "bind -n M-d detach-client".
detach = ["prefix+q", "alt+d"]

# Sidebar holds Spaces + Agents; toggle it since it starts hidden below.
toggle_sidebar = "prefix+b"

reload_config = "prefix+shift+r"
help          = "prefix+?"

[ui]
# Tab row below the panes.
tab_bar_position = "bottom"

# Hide the Spaces/Agents sidebar by default; prefix+b brings it back.
sidebar_start_collapsed = true
sidebar_collapsed_mode  = "hidden"

# Marker in the outer terminal title so kitty can scope its `--when-focus-on`
# keymaps to herdr panes (see kitty/kitty.conf).
window_title = "herdr: {workspace}"

# Stand-in for the byobu status line (byobu/status showed logo, session, hostname).
tab_bar_right = [
  { type = "hostname" },
  { type = "datetime" },
]

[ui.sound]
# Absolute paths dodge relative resolution against the nix-store symlink target.
# Files deployed from herdr/sounds/ via herdr.nix, which replaces @HOME@ with
# home.homeDirectory.
done_path    = "@HOME@/.config/herdr/sounds/done.mp3"
request_path = "@HOME@/.config/herdr/sounds/request.mp3"

[terminal]
new_cwd = "follow"
