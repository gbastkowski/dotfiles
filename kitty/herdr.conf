# Herdr navigation
# kitty binds super+[, super+], super+t etc. to its own tabs/windows above, so
# scope these to herdr windows. The title marker comes from ui.window_title in
# herdr/config.toml. send_key forwards the chord unchanged; herdr binds the
# super+... chords itself (needs the kitty keyboard protocol).
map --when-focus-on title:^herdr super+[ send_key super+[
map --when-focus-on title:^herdr super+] send_key super+]

# Workspaces. kitty binds super+shift+[ / ] to previous/next_tab by default.
map --when-focus-on title:^herdr super+shift+[ send_key super+shift+[
map --when-focus-on title:^herdr super+shift+] send_key super+shift+]

map --when-focus-on title:^herdr super+1 send_key super+1
map --when-focus-on title:^herdr super+2 send_key super+2
map --when-focus-on title:^herdr super+3 send_key super+3
map --when-focus-on title:^herdr super+4 send_key super+4
map --when-focus-on title:^herdr super+5 send_key super+5
map --when-focus-on title:^herdr super+6 send_key super+6
map --when-focus-on title:^herdr super+7 send_key super+7
map --when-focus-on title:^herdr super+8 send_key super+8
map --when-focus-on title:^herdr super+9 send_key super+9

# Pane focus (herdr focus_pane_*).
map --when-focus-on title:^herdr super+shift+h send_key super+shift+h
map --when-focus-on title:^herdr super+shift+j send_key super+shift+j
map --when-focus-on title:^herdr super+shift+k send_key super+shift+k
map --when-focus-on title:^herdr super+shift+l send_key super+shift+l

# Herdr tab/pane management
map --when-focus-on title:^herdr super+t send_key super+t
map --when-focus-on title:^herdr super+d send_key super+d
map --when-focus-on title:^herdr super+e send_key super+e
map --when-focus-on title:^herdr super+semicolon send_key super+semicolon

# byobu used super+, for rename-tab.
map --when-focus-on title:^herdr super+, send_key super+,
