    <text class="catN"  x="7" y="10">ultrabrain</text>
    <text class="catAlt" x="7" y="14">a.k.a. Ultraworker</text>
    <text class="catD"  x="7" y="19">Hard logic, algorithms, arch.</text>
    <rect class="heavy" x="7"  y="22" width="24" height="5" rx="1"/>
    <text class="chip" x="9" y="25.7">OPUS · xhigh</text>
    <rect class="heavy" x="33" y="22" width="24" height="5" rx="1"/>
