# Herdr navigation
# kitty binds super+[, super+], super+t etc. to its own tabs/windows above, so
# scope these to herdr windows. The title marker comes from ui.window_title in
# herdr/config.toml.  is C-a, herdr's prefix.
map --when-focus-on title:^herdr super+[ send_key super+[
map --when-focus-on title:^herdr super+] send_key super+]

map --when-focus-on title:^herdr super+1 send_text all 1
map --when-focus-on title:^herdr super+2 send_text all 2
map --when-focus-on title:^herdr super+3 send_text all 3
map --when-focus-on title:^herdr super+4 send_text all 4
map --when-focus-on title:^herdr super+5 send_text all 5
map --when-focus-on title:^herdr super+6 send_text all 6
map --when-focus-on title:^herdr super+7 send_text all 7
map --when-focus-on title:^herdr super+8 send_text all 8
map --when-focus-on title:^herdr super+9 send_text all 9

# Pane focus (herdr focus_pane_* = prefix+hjkl).
map --when-focus-on title:^herdr super+shift+h send_text all h
map --when-focus-on title:^herdr super+shift+j send_text all j
map --when-focus-on title:^herdr super+shift+k send_text all k
map --when-focus-on title:^herdr super+shift+l send_text all l

# Herdr tab/pane management
map --when-focus-on title:^herdr super+t send_text all c
map --when-focus-on title:^herdr super+d send_text all v
map --when-focus-on title:^herdr super+e send_text all s
map --when-focus-on title:^herdr super+semicolon send_text all [

# byobu used super+, for rename-tab; in herdr prefix+, is previous-tab, so send
# the shifted form (rename_tab = prefix+shift+t).
map --when-focus-on title:^herdr super+, send_text all T
